name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Java (needed by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # flutter build apk signs with the debug keystore when no release
      # signing config is set up. That keystore is normally generated fresh
      # on first use — since every Actions run is a brand-new machine, every
      # build would otherwise get signed with a DIFFERENT key, and Android
      # refuses to install an update signed with a different key than the
      # one already on the device ("App not installed"). Caching the
      # keystore file under a fixed key keeps the signature stable across
      # runs: the first run generates and saves it, every run after restores
      # the same file.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # The repo only carries lib/ and pubspec.yaml — the native android/
      # project (Gradle files, AndroidManifest.xml, etc.) is generated
      # here by the real Flutter tool on every run, which is far less
      # fragile than committing hand-written Gradle files.
      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.parshan .

      # Flutter's template only adds INTERNET permission to the DEBUG
      # variant's manifest (android/app/src/debug/AndroidManifest.xml) —
      # the main manifest used by release builds may not have it, which
      # would silently block all network access (including TDLib's) in
      # the release APK we ship. Make sure it's there explicitly.
      - name: Ensure INTERNET permission in release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      # file_picker's transitive dependency (flutter_plugin_android_lifecycle)
      # requires compiling against Android API 36+. Flutter's generated
      # build.gradle.kts defaults to whatever the installed Flutter SDK
      # ships (often lower), so bump it explicitly rather than waiting for
      # subosito/flutter-action's bundled default to catch up.
      - name: Bump compileSdk to 36
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          if ! grep -q "compileSdk = 36" "$GRADLE"; then
            echo "::error::Expected pattern not found in $GRADLE — inspect the file and update the sed pattern above."
            cat "$GRADLE"
            exit 1
          fi
          grep -n "compileSdk" "$GRADLE"

      # libtdjson's Android build pulls a prebuilt libtdjson.so from GitHub
      # Packages (https://github.com/up9cloud/android-libtdjson). Reading a
      # PUBLIC package there works with the default GITHUB_TOKEN; if this
      # step fails with 401/403, create a personal access token with the
      # `read:packages` scope, add it as a repository secret (e.g.
      # TD_READ_TOKEN), and use that instead of secrets.GITHUB_TOKEN below.
      - name: Build APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-explorer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
